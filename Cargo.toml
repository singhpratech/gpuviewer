[workspace]
resolver = "2"
members = ["crates/core", "crates/history", "crates/tui"]

[workspace.package]
version = "0.1.1"
edition = "2021"
# Empirically verified: 1.95 is the oldest toolchain that builds the workspace
# (libsqlite3-sys 0.38's build script uses `cfg_select!`, stabilized in 1.95).
rust-version = "1.95"
license = "MIT OR Apache-2.0"
# Without this, cargo packages NO readme and every crates.io page renders as a bare
# one-line description. Inherited paths resolve against the workspace root, so all three
# crates ship the same front page the repo has.
readme = "README.md"
homepage = "https://singhpratech.github.io/gpuviewer/"
repository = "https://github.com/singhpratech/gpuviewer"

[workspace.dependencies]
# `version` alongside `path`: inside the workspace cargo uses the path, but crates.io
# requires a version requirement on every dependency and strips the path on publish.
# Without it `cargo publish` refuses the manifest. Bump these with the workspace version.
gpuviewer-core = { version = "0.1.1", path = "crates/core" }
gpuviewer-history = { version = "0.1.1", path = "crates/history" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.30"
chrono = "0.4"
# `bundled` so SQLite is compiled in (no system lib, no soname churn — same rationale as
# not linking librocm_smi64). 0.40's libsqlite3-sys needs `cfg_select!` (stable since
# rustc 1.95) — reflected in the workspace rust-version below.
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true
