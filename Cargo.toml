[workspace]
resolver = "2"
members = ["crates/core", "crates/history", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/singhpratech/gpuviewer"

[workspace.dependencies]
gpuviewer-core = { path = "crates/core" }
gpuviewer-history = { path = "crates/history" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.30"
chrono = "0.4"

[profile.release]
lto = "thin"
strip = true
