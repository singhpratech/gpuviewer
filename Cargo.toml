[workspace]
resolver = "2"
members = ["crates/core", "crates/history", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/singhpratech/gpuviewer"

[workspace.dependencies]
gpuviewer-core = { path = "crates/core" }
gpuviewer-history = { path = "crates/history" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.30"
chrono = "0.4"
# Pinned to 0.39 (not the latest 0.40): rusqlite 0.40 pulls libsqlite3-sys 0.38, whose
# build script uses the `cfg_select!` std macro, still unstable on this toolchain (rustc
# 1.94.0, issue #115585). 0.39 -> libsqlite3-sys 0.37 builds cleanly. Bump to 0.40 once the
# toolchain stabilizes cfg_select. `bundled` so SQLite is compiled in (no system lib, no
# soname churn — same rationale as not linking librocm_smi64).
rusqlite = { version = "0.39", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true
