name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-runs of the matrix. (The one-off macOS ground-truth probe used to ride
  # here behind an `if:`, but a conditional job reports as a SKIPPED check on every
  # push — it lives in its own workflow now: .github/workflows/macos-probe.yml.)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # fmt is style-only and platform-independent — one leg is enough.
          - os: ubuntu-latest
            lint: true
          - os: windows-latest
            lint: false
          # Pinned to macos-15: macos-latest re-points to macos-26 starting 2026-06-15 —
          # do not let the image change underneath a brand-new leg mid-rollout.
          - os: macos-15
            lint: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Keys per-OS automatically (rustc host triple + job id). The three caches share
      # the repo's 10 GB quota — monitor hit rates now that the matrix is 3-wide.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - if: matrix.lint
        run: cargo fmt --check

      # clippy runs on EVERY leg: -D warnings on ubuntu alone would never compile the
      # cfg(windows)/cfg(macos) code paths at all.
      - run: cargo clippy --all-targets -- -D warnings

      # All tests run against the mock backend — no GPU needed (the GPU-less runners
      # exercise the absence-is-normal paths for free).
      - run: cargo test

      # Lying-green guard (research 07 §P1-13): the fixture-driven suites only prove
      # anything if cargo actually enumerates their tests — an accidental cfg gate or a
      # silently-missing fixture tree can shrink a suite toward zero and still exit
      # green. Fail if the enumerated count drops below the committed floor. RAISE the
      # floors when fixture tests land; never lower them without a recorded reason.
      # Linux leg only: the fixture suites are #![cfg(target_os = "linux")].
      - if: runner.os == 'Linux'
        name: Fixture-test count floor
        run: |
          set -euo pipefail
          check_floor() {
            local target="$1" floor="$2" n
            n="$(cargo test -p gpuviewer-core --test "$target" -- --list | grep -c ': test$' || true)"
            echo "$target enumerates $n tests (floor: $floor)"
            if [ "$n" -lt "$floor" ]; then
              echo "::error::$target enumerates $n tests, below the floor of $floor — a cfg gate or fixture tree is silently dropping tests"
              exit 1
            fi
          }
          # Floors = enumerated counts on 2026-06-07.
          check_floor amd_fixtures 19
          check_floor intel_fixtures 23
          check_floor nvml_stub_loader 2
